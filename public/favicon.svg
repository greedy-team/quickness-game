<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="120" fill="#05070A"/>

  <defs>
    <linearGradient id="blood" x1="256" y1="80" x2="256" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF3B3B"/>
      <stop offset="1" stop-color="#7A0000"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background cracks -->
  <path d="M120 90L170 150L140 210L210 270" stroke="#1B1F24" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <path d="M410 110L360 170L390 250L320 320" stroke="#1B1F24" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

  <!-- horror eye shape -->
  <ellipse cx="256" cy="250" rx="150" ry="92" fill="#0B0D11" stroke="#1D232B" stroke-width="8"/>

  <!-- red pupil -->
  <circle cx="256" cy="250" r="58" fill="url(#blood)" filter="url(#glow)"/>

  <!-- slit pupil -->
  <path d="M256 180C272 230 272 270 256 320C240 270 240 230 256 180Z" fill="#05070A"/>

  <!-- blood drips -->
  <path d="M208 332C208 332 198 368 208 392C218 416 238 412 236 388C234 364 220 348 220 332H208Z" fill="url(#blood)"/>
  <path d="M282 332C282 332 276 360 282 378C288 396 304 394 304 374C304 354 292 344 292 332H282Z" fill="url(#blood)"/>

  <!-- subtle highlight -->
  <circle cx="232" cy="222" r="14" fill="#FFD9D9" opacity="0.35"/>
</svg>